<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>墨竹轩 · 个人博客</title>
  <!-- 引入 Google Fonts 优雅古风衬线字体（Noto Serif SC） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.3">
</head>
<body>

  <!-- ================= 第一部分：刚进入博客时的开屏封面 ================= -->
  <section id="intro-screen" class="intro-screen">
    <!-- 墨竹背景遮罩层（增强古风质感与文字对比度） -->
    <div class="intro-bg-overlay"></div>

    <div class="intro-content">
      <!-- 居中头像与跳动光圈 -->
      <div class="avatar-halo-container">
        <div class="halo halo-1"></div>
        <div class="halo halo-2"></div>
        <div class="halo halo-3"></div>
        <div class="avatar-wrapper">
          <img src="assets/avatar.jpg?v=2.3" alt="作者头像" class="intro-avatar" onerror="this.src='assets/avatar.png?v=2.3'">
        </div>
      </div>

      <!-- 博主题字/印章副标 -->
      <div class="intro-title-group">
        <h1 class="intro-title">墨 竹 轩</h1>
        <p class="intro-subtitle">竹杖芒鞋轻胜马 · 笔墨浮生话长卷</p>
      </div>

      <!-- 进入博客按钮 -->
      <button id="enter-blog-btn" class="enter-btn">
        <span>进入博客</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- 底部古风印记 -->
    <div class="intro-footer-text">「 宁可食无肉 · 不可居无竹 」</div>
  </section>


  <!-- ================= 第二部分：博客主界面（左文本，右头像与信息） ================= -->
  <main id="blog-main" class="blog-main" style="display: none;">
    <!-- 顶部导航栏 -->
    <header class="blog-header">
      <div class="header-inner">
        <div class="logo-area" id="header-logo">
          <span class="logo-seal">墨</span>
          <span class="logo-text">墨竹轩</span>
        </div>
        <div class="header-actions">
          <!-- 点击返回开屏 -->
          <button id="back-to-intro-btn" class="back-intro-tag">返回封面</button>
        </div>
      </div>
    </header>

    <!-- 页面核心主体：三栏分治（左侧树状目录，中间正文阅读，右侧个人信息） -->
    <div class="container main-content-layout">

      <!-- ================= 1. 左侧：树状知识目录 ================= -->
      <aside class="left-tree-sidebar sticky-sidebar">
        <div class="tree-panel">
          <div class="tree-panel-header">
            <span class="tree-root-icon">📖</span>
            <span class="tree-root-title">学习笔记</span>
          </div>

          <!-- 检索框 -->
          <div class="tree-search-box">
            <input type="text" id="tree-search" placeholder="检索笔记篇章...">
          </div>

          <!-- 树状节点清单 -->
          <div class="tree-menu" id="tree-menu">
            <!-- 一级主分类：机器学习 -->
            <div class="tree-group open" id="group-ml">
              <div class="tree-node tree-group-head" onclick="toggleTreeGroup(this)">
                <span class="node-icon">🤖</span>
                <span class="node-label">机器学习</span>
                <svg class="chevron-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </div>

              <!-- 二级分类：第一章 简述 -->
              <div class="tree-subgroup open">
                <div class="tree-node tree-subgroup-head" onclick="toggleTreeSubgroup(this)">
                  <span class="node-icon">📁</span>
                  <span class="node-label">第一章 简述</span>
                  <svg class="chevron-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </div>

                <!-- 三篇文档清单 -->
                <div class="tree-leaf-container" id="tree-leaf-container">
                  <div class="tree-leaf-item active" data-id="1" onclick="selectArticle(1)">
                    <span class="leaf-icon">📄</span>
                    <span class="leaf-title">机器学习</span>
                  </div>
                  <div class="tree-leaf-item" data-id="2" onclick="selectArticle(2)">
                    <span class="leaf-icon">📄</span>
                    <span class="leaf-title">神经网络</span>
                  </div>
                  <div class="tree-leaf-item" data-id="3" onclick="selectArticle(3)">
                    <span class="leaf-icon">📄</span>
                    <span class="leaf-title">深度学习</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- ================= 2. 中间：正文阅读核心展示区 ================= -->
      <section class="center-content-area">
        <article id="article-detail-view" class="article-detail">
          <!-- 面包屑导航 -->
          <nav class="breadcrumb-bar" id="breadcrumb-bar">
            <span>学习笔记</span>
            <span class="bc-sep">/</span>
            <span id="bc-category">AI入门</span>
            <span class="bc-sep">/</span>
            <span id="bc-chapter">第一章 简述</span>
            <span class="bc-sep">/</span>
            <span class="bc-current" id="bc-current">简介</span>
          </nav>

          <header class="detail-header">
            <h1 class="detail-title" id="detail-title">机器学习</h1>
            <div class="detail-meta">
              <span id="detail-date">2026-10-22</span> · 
              <span id="detail-readtime">阅读约需 4 分钟</span> · 
              <span id="detail-views">460 次阅览</span>
            </div>
          </header>

          <hr class="ink-divider">

          <div class="detail-body" id="detail-body">
            <!-- 正文内容将由 JS 动态装载 -->
          </div>

          <!-- 底部上一篇/下一篇翻页导航 -->
          <footer class="article-pager">
            <button id="prev-article-btn" class="pager-btn prev" onclick="navigateArticle(-1)">
              <span class="pager-label">← 上一篇</span>
              <span class="pager-title" id="prev-article-title">无</span>
            </button>
            <button id="next-article-btn" class="pager-btn next" onclick="navigateArticle(1)">
              <span class="pager-label">下一篇 →</span>
              <span class="pager-title" id="next-article-title">神经网络</span>
            </button>
          </footer>
        </article>
      </section>

      <!-- ================= 右侧：作者头像与个人信息栏 ================= -->
      <aside class="right-sidebar">
        <!-- 个人资料卡片（随滚轮自然上下滚动，兼具QQ弹弹动效） -->
        <div class="profile-card">
          <!-- 个人头部 -->
          <div class="profile-banner"></div>
          <div class="profile-avatar-box">
            <img src="assets/avatar.jpg?v=2.3" alt="作者头像" class="profile-avatar" onerror="this.src='assets/avatar.png?v=2.3'">
          </div>

          <!-- 博主姓名与印章 -->
          <div class="profile-meta">
            <h3 class="author-name">远山仙 <span class="author-tag">博主</span></h3>
            <p class="author-motto">“竹杖芒鞋轻胜马，一蓑烟雨任平生。”</p>
          </div>

          <!-- 数据统计 -->
          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-num" id="stat-articles">5</span>
              <span class="stat-label">文稿</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="stat-columns">2</span>
              <span class="stat-label">专栏</span>
            </div>
          </div>

          <!-- 个人详细简介 -->
          <div class="profile-bio">
            <p>晴空一鹤排云上。</p>
          </div>

          <hr class="ink-divider-thin">

          <!-- 社交与外部平台矩阵 -->
          <div class="sidebar-widget">
            <h4 class="widget-title">全 网 关 联</h4>
            <div class="profile-social-grid">
              <!-- 1. GitHub -->
              <a href="https://github.com/ysx3752-design" target="_blank" rel="noopener noreferrer" class="social-grid-btn" title="访问 远山仙 (ysx3752-design) 的 GitHub">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
                <span>GitHub</span>
              </a>

              <!-- 2. 哔哩哔哩 (B站) -->
              <a href="https://space.bilibili.com/3546774568438667" target="_blank" rel="noopener noreferrer" class="social-grid-btn bilibili" title="访问 远山仙 的 B站 空间">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M17.813 4.653h.854c1.51 0 2.733 1.224 2.733 2.734v9.508c0 1.51-1.223 2.734-2.733 2.734H5.333C3.823 19.629 2.6 18.405 2.6 16.895V7.387c0-1.51 1.223-2.734 2.733-2.734h.98l-1.32-1.32a.75.75 0 1 1 1.06-1.061l2.44 2.44a.75.75 0 0 1-.059 1.12.75.75 0 0 1-.471.175H5.333c-.68 0-1.233.553-1.233 1.234v9.508c0 .68.553 1.234 1.233 1.234h13.334c.68 0 1.233-.553 1.233-1.234V7.387c0-.68-.553-1.234-1.233-1.234h-1.428a.75.75 0 0 1-.53-.22l-2.44-2.44a.75.75 0 1 1 1.06-1.06l1.378 1.378a.748.748 0 0 1 .373-.158zM8.5 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
                </svg>
                <span>哔哩哔哩</span>
              </a>
            </div>
          </div>

          <!-- 热门标签专栏 -->
          <div class="sidebar-widget">
            <h4 class="widget-title">标 签 云</h4>
            <div class="tag-cloud">
              <span class="tag-pill">Python</span>
              <span class="tag-pill">Go</span>
            </div>
          </div>
        </div>
      </aside>

    </div>

    <!-- 博客页脚 -->
    <footer class="blog-footer">
      <p>© 2026 墨竹轩 · 宁静致远 · 循序渐进</p>
    </footer>
  </main>

  <!-- 页面右下角：背景日光/黑夜模式切换浮动按钮 -->
  <div class="theme-floating-widget" id="theme-floating-widget">
    <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="切换日光/黑夜背景" title="点击切换 日光 / 黑夜 背景">
      <span class="theme-btn-icon" id="theme-btn-icon">☀️</span>
      <span class="theme-btn-label" id="theme-btn-label">日光</span>
    </button>
  </div>

  <!-- 引入文稿数据源（支持通过 Python 脚本从任意目录同步） -->
  <script src="articles.js?v=2.3"></script>
  <script src="script.js?v=2.3"></script>
</body>
</html>
